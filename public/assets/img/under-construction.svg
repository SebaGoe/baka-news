<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A hard-hatted worker digging under an Under Construction sign">
  <defs>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#ffd400"/>
      <rect width="14" height="28" fill="#1c1b17"/>
    </pattern>
  </defs>

  <!-- Sign board -->
  <rect x="6" y="8" width="308" height="52" rx="4" fill="#ffd400" stroke="#1c1b17" stroke-width="4"/>
  <rect x="6" y="8" width="308" height="10" fill="url(#hazard)" opacity="0.9"/>
  <rect x="6" y="50" width="308" height="10" fill="url(#hazard)" opacity="0.9"/>
  <text x="160" y="42" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
        font-size="26" letter-spacing="2" fill="#1c1b17">UNDER CONSTRUCTION</text>

  <!-- Support posts -->
  <rect x="40" y="60" width="8" height="70" fill="#8a6a3a" stroke="#1c1b17" stroke-width="2"/>
  <rect x="272" y="60" width="8" height="70" fill="#8a6a3a" stroke="#1c1b17" stroke-width="2"/>

  <!-- Ground -->
  <rect x="0" y="176" width="320" height="24" fill="#c9b483"/>
  <line x1="0" y1="176" x2="320" y2="176" stroke="#1c1b17" stroke-width="3"/>

  <!-- Dirt pile -->
  <path d="M196 176 q28 -26 60 0 Z" fill="#8a6a3a" stroke="#1c1b17" stroke-width="2"/>
  <circle cx="214" cy="171" r="3" fill="#6f5330"/>
  <circle cx="232" cy="167" r="3" fill="#6f5330"/>
  <circle cx="246" cy="172" r="3" fill="#6f5330"/>

  <!-- Worker -->
  <g stroke="#1c1b17" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- legs -->
    <path d="M120 176 l6 -26 l10 22"/>
    <!-- body -->
    <path d="M126 150 l4 -24"/>
    <!-- arms + shovel (animated) -->
    <g>
      <path d="M130 132 l18 8"/>
      <path d="M130 132 l-16 12"/>
      <!-- shovel -->
      <path d="M148 140 l26 14" stroke-width="4"/>
      <path d="M172 150 q10 4 12 14 q-12 2 -18 -6 Z" fill="#b9c0c7" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 130 132; -14 130 132; 0 130 132" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <!-- head -->
    <circle cx="130" cy="118" r="9" fill="#f6d9b0"/>
  </g>
  <!-- hard hat -->
  <path d="M119 116 a11 11 0 0 1 22 0 Z" fill="#ffd400" stroke="#1c1b17" stroke-width="3"/>
  <rect x="116" y="115" width="28" height="4" rx="2" fill="#ffd400" stroke="#1c1b17" stroke-width="2"/>

  <!-- Blinking caution lamp on the sign -->
  <circle cx="20" cy="34" r="5" fill="#9e2b25" stroke="#1c1b17" stroke-width="2">
    <animate attributeName="opacity" values="1;1;0.15;0.15" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="34" r="5" fill="#9e2b25" stroke="#1c1b17" stroke-width="2">
    <animate attributeName="opacity" values="0.15;0.15;1;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
