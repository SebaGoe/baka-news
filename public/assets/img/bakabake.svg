<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" role="img" aria-label="Bakabake the ghost">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f7fff2"/>
      <stop offset="70%" stop-color="#e4f7d8"/>
      <stop offset="100%" stop-color="#cfeeba"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a7a3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Lego-style stud on the head (nod to the old glow ghost) -->
  <ellipse cx="80" cy="14" rx="15" ry="7" fill="#e4f7d8" stroke="#9cc47a" stroke-width="2"/>
  <rect x="65" y="12" width="30" height="10" fill="#eafce0"/>

  <!-- Sheet body: rounded dome + wavy hem -->
  <path filter="url(#soft)" fill="url(#glow)" stroke="#9cc47a" stroke-width="3" stroke-linejoin="round"
        d="M80 16
           C40 16 30 52 30 92
           L30 168
           q0 14 -10 20 q16 6 24 -6
           q10 14 24 0 q10 14 24 0 q10 14 24 0 q10 14 24 0
           q10 14 24 6 q-10 -6 -10 -20
           L154 92
           C154 52 120 16 80 16 Z"
        transform="translate(-14,0)"/>

  <!-- Eyes -->
  <g fill="#2b2b2b">
    <ellipse cx="60" cy="86" rx="9" ry="13"/>
    <ellipse cx="100" cy="86" rx="9" ry="13"/>
  </g>
  <!-- eye shine -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="57" cy="80" r="3"/>
    <circle cx="97" cy="80" r="3"/>
  </g>

  <!-- Little worried mouth (Lego ghost vibe) -->
  <path d="M68 118 q12 -12 24 0" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>

  <!-- Blush -->
  <g fill="#ffb3c1" opacity="0.55">
    <ellipse cx="48" cy="104" rx="7" ry="4"/>
    <ellipse cx="112" cy="104" rx="7" ry="4"/>
  </g>
</svg>
